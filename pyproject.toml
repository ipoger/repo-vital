[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-vital"
version = "0.1.0"
description = "Score a repository's contributor readiness and get a prioritized to-do list."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ipoger" }]
keywords = ["open-source", "contributing", "maintainers", "cli", "repository-health"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.scripts]
repo-vital = "repo_vital.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ipoger/repo-vital"
Issues = "https://github.com/ipoger/repo-vital/issues"

[tool.setuptools]
packages = ["repo_vital"]
