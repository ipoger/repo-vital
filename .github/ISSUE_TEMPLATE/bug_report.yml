name: Bug report
description: Something is broken, or a rule fires when it should not.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal reproduction is worth more than a long description.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command, the output you got, and the output you expected.
      placeholder: |
        $ repo-vital .
        Score 42/100 ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest directory tree that shows the problem.
      placeholder: |
        mkdir demo && cd demo && echo "# hi" > README.md
        repo-vital .
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: repo-vital version
      description: Output of `repo-vital --version`.
      placeholder: repo-vital 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: 3.12.4 on macOS 15.1
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
